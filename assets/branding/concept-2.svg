<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 240" role="img" aria-label="DJ Orestis wordmark, concept 2, with vinyl O">
  <title>DJORESTIS — Concept 2: The Vinyl O</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel&amp;family=Cinzel&family=Marcellus&amp;family=Jost:wght@300&amp;display=swap');
    .wordmark { font-family: 'Cinzel', 'Marcellus', 'Palatino Linotype', 'Book Antiqua', Georgia, serif; font-size: 62px; letter-spacing: 8px; }
    .tagline  { font-family: 'Jost', 'Century Gothic', 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 300; font-size: 14px; letter-spacing: 4.5px; }
    .gold  { fill: #C6A15B; }
    .ivory { fill: #F4F1E8; }
    .grey  { fill: #A8A49A; }
  </style>
  <rect width="770" height="240" fill="#0E0E10"/>

  <!-- DJ (gold), right-aligned up to the record -->
  <text x="258" y="130" text-anchor="end" class="wordmark gold">DJ</text>

  <!-- The letter O drawn as a vinyl record: outer ring, groove, label dot -->
  <g>
    <circle cx="302" cy="108" r="30" fill="none" stroke="#C6A15B" stroke-width="2.6"/>
    <circle cx="302" cy="108" r="19" fill="none" stroke="#F4F1E8" stroke-width="1" opacity="0.45"/>
    <circle cx="302" cy="108" r="4.6" fill="#C6A15B"/>
  </g>

  <!-- RESTIS (ivory), continuing after the record -->
  <text x="346" y="130" text-anchor="start" class="wordmark ivory">RESTIS</text>

  <!-- Tagline -->
  <text x="385" y="186" text-anchor="middle" class="tagline grey">YOUR EVENT AS YOU DREAM IT</text>
</svg>
