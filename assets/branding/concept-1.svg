<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img" aria-label="DJ Orestis wordmark, concept 1">
  <title>DJORESTIS — Concept 1: Lapidary Wordmark</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel&amp;family=Cinzel&family=Marcellus&amp;family=Jost:wght@300&amp;display=swap');
    .wordmark { font-family: 'Cinzel', 'Marcellus', 'Palatino Linotype', 'Book Antiqua', Georgia, serif; font-size: 64px; letter-spacing: 10px; }
    .tagline  { font-family: 'Jost', 'Century Gothic', 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 300; font-size: 15px; letter-spacing: 5px; }
    .gold  { fill: #C6A15B; }
    .ivory { fill: #F4F1E8; }
    .grey  { fill: #A8A49A; }
  </style>
  <rect width="720" height="260" fill="#0E0E10"/>

  <!-- Top ornament: hairlines with a small diamond -->
  <g stroke="#C6A15B" stroke-width="1">
    <line x1="250" y1="52" x2="342" y2="52" opacity="0.55"/>
    <line x1="378" y1="52" x2="470" y2="52" opacity="0.55"/>
  </g>
  <rect x="354" y="46" width="12" height="12" transform="rotate(45 360 52)" fill="none" stroke="#C6A15B" stroke-width="1.2"/>

  <!-- Wordmark: gold DJ + ivory ORESTIS -->
  <text x="365" y="140" text-anchor="middle" class="wordmark"><tspan class="gold">DJ</tspan><tspan class="ivory">ORESTIS</tspan></text>

  <!-- Tagline with flanking hairlines -->
  <g stroke="#6E6A61" stroke-width="1">
    <line x1="120" y1="192" x2="212" y2="192"/>
    <line x1="508" y1="192" x2="600" y2="192"/>
  </g>
  <text x="360" y="197" text-anchor="middle" class="tagline grey">YOUR EVENT AS YOU DREAM IT</text>
</svg>
