<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 240" role="img" aria-label="DJ Orestis wordmark, concept 3, with column-waveform mark">
  <title>DJORESTIS — Concept 3: Column &amp; Waveform</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Jost:wght@300;600&amp;display=swap');
    .wordmark { font-family: 'Jost', 'Century Gothic', 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 600; font-size: 52px; letter-spacing: 11px; }
    .tagline  { font-family: 'Jost', 'Century Gothic', 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 300; font-size: 14px; letter-spacing: 4.5px; }
    .gold  { fill: #C6A15B; }
    .ivory { fill: #F4F1E8; }
    .grey  { fill: #A8A49A; }
  </style>
  <rect width="770" height="240" fill="#0E0E10"/>

  <!-- Mark: five symmetric bars — a soundwave that is also a column silhouette -->
  <g fill="#C6A15B">
    <rect x="70"  y="89" width="5" height="20" rx="2.5"/>
    <rect x="81"  y="81" width="5" height="36" rx="2.5"/>
    <rect x="92"  y="72" width="5" height="54" rx="2.5"/>
    <rect x="103" y="81" width="5" height="36" rx="2.5"/>
    <rect x="114" y="89" width="5" height="20" rx="2.5"/>
  </g>

  <!-- Wordmark -->
  <text x="160" y="117" class="wordmark"><tspan class="gold">DJ</tspan><tspan class="ivory" dx="6">ORESTIS</tspan></text>

  <!-- Tagline aligned with wordmark -->
  <text x="163" y="160" class="tagline grey">YOUR EVENT AS YOU DREAM IT</text>
</svg>
