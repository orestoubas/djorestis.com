<!DOCTYPE html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'Marcellus';src:url('../../assets/fonts/marcellus-400-latin.woff2') format('woff2')}
@font-face{font-family:'Jost';font-weight:300;src:url('../../assets/fonts/jost-300-latin.woff2') format('woff2')}
*{margin:0;padding:0;box-sizing:border-box}
.canvas{position:relative;width:2000px;height:620px;display:flex;flex-direction:column;
 align-items:center;justify-content:center;font-family:'Jost',sans-serif}
.canvas.dark{background:#0E0E10}
.lg{font-family:'Marcellus',serif;font-size:250px;letter-spacing:30px;line-height:1;white-space:nowrap;color:#F4F1E8}
.lg .dj{color:#C6A15B}
.lg .o{display:inline-block;width:215px;height:215px;border:8px solid #C6A15B;border-radius:50%;
 position:relative;top:34px;margin:0 18px}
.lg .o::before{content:"";position:absolute;inset:56px;border:3px solid rgba(244,241,232,.45);border-radius:50%}
.lg .o::after{content:"";position:absolute;inset:93px;background:#C6A15B;border-radius:50%}
.tag{margin-top:56px;color:#A8A49A;font-weight:300;font-size:44px;letter-spacing:19px;text-transform:uppercase}
</style></head><body><div class="canvas CLS">
<div class="lg"><span class="dj">DJ</span><span class="o"></span><span>RESTIS</span></div>
<div class="tag">Your event as you dream it</div>
</div></body></html>
