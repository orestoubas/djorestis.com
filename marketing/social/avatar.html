<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DJORESTIS — Avatar 1024</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1024px; height: 1024px; overflow: hidden; background: #0E0E10; }
  svg { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body>
<svg viewBox="0 0 1024 1024" role="img" aria-label="DJ Orestis vinyl monogram">
  <defs>
    <radialGradient id="bg" cx="50%" cy="46%" r="72%">
      <stop offset="0%"  stop-color="#16161A"/>
      <stop offset="60%" stop-color="#101013"/>
      <stop offset="100%" stop-color="#0E0E10"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#C6A15B" stop-opacity="0.16"/>
      <stop offset="55%"  stop-color="#C6A15B" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#C6A15B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#D9BC7F"/>
      <stop offset="50%"  stop-color="#C6A15B"/>
      <stop offset="100%" stop-color="#A98844"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- Subtle radial gold glow behind the record -->
  <circle cx="512" cy="512" r="470" fill="url(#glow)"/>

  <!-- Vinyl record monogram (refined favicon at scale) -->
  <!-- Outer gold ring -->
  <circle cx="512" cy="512" r="320" fill="none" stroke="url(#ring)" stroke-width="42"/>
  <!-- Fine inner edge of the gold ring -->
  <circle cx="512" cy="512" r="288" fill="none" stroke="#0E0E10" stroke-width="2" opacity="0.6"/>

  <!-- Faint ivory grooves -->
  <circle cx="512" cy="512" r="244" fill="none" stroke="#F4F1E8" stroke-width="4"   opacity="0.30"/>
  <circle cx="512" cy="512" r="206" fill="none" stroke="#F4F1E8" stroke-width="2.5" opacity="0.18"/>
  <circle cx="512" cy="512" r="172" fill="none" stroke="#F4F1E8" stroke-width="2"   opacity="0.10"/>

  <!-- Label ring -->
  <circle cx="512" cy="512" r="118" fill="none" stroke="#C6A15B" stroke-width="3" opacity="0.35"/>

  <!-- Gold label dot with spindle hole -->
  <circle cx="512" cy="512" r="74" fill="url(#ring)"/>
  <circle cx="512" cy="512" r="10" fill="#0E0E10"/>
</svg>
</body>
</html>
